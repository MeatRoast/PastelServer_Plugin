server-name: "로비"
poll-tick: 20

formats:
  global-format: "&b[전체/{server}] &f[닉네임 {nickname}<{username}>] : {message}"
  server-format: "&a[서버/{server}] &f[닉네임 {nickname}<{username}>] : {message}"
  local-format: "&c[지역/{server}] &f[닉네임 {nickname}<{username}>] : {message}"
  remote-global-format: "&b[전체/{server}] &f[닉네임 {nickname}<{username}>] : {message}"

chat:
  table: "global_chat"
  log-table: "chat_logs"
  mode-table: "player_chat_mode"
  profile-table: "player_chat_profile"
  max-content-length: 256
  local-radius: 200.0

items:
  color-chat:
    name: "&b[ 색깔채팅 ]"
    lore:
      - "&7우클릭 시 다음 1회 채팅에"
      - "&7색상 코드를 사용할 수 있습니다."
  nickname-change:
    name: "&a[ 닉네임변경권 ]"
    lore:
      - "&7/닉네임 변경 <닉네임>"
      - "&7일반 닉네임만 가능합니다."
  colored-nickname-change:
    name: "&d[ 색깔닉네임변경권 ]"
    lore:
      - "&7/닉네임 변경 <닉네임>"
      - "&7색상 코드 및 HEX 사용 가능"

messages:
  player-only: "&c플레이어만 사용할 수 있습니다."
  no-permission: "&c권한이 없습니다."
  color-chat-armed: "&b[채팅] &f색깔채팅권이 활성화되었습니다. 이제부터 색상 코드를 사용할 수 있습니다."
  color-chat-already-active: "&e이미 색깔채팅권이 활성화되었습니다"

  chatmode-usage: "&e사용법: /채팅모드 <전체|서버|지역>"
  chatmode-invalid: "&c알 수 없는 모드입니다. /채팅모드 <전체|서버|지역>"
  chatmode-changed: "&a채팅 모드가 {mode}(으)로 변경되었습니다."

  nickname-usage: "&e사용법: /닉네임 변경 <변경할닉네임>"
  nickname-length: "&c닉네임은 1~16자로 입력하세요."
  nickname-need-ticket: "&c닉네임변경권 또는 색깔닉네임변경권이 필요합니다."
  nickname-color-not-allowed: "&c색깔코드 이용불가능합니다"
  nickname-invalid: "&c유효한 닉네임이 아닙니다."
  nickname-changed: "&a닉네임이 변경되었습니다: &f{nickname}"

  giveitem-usage: "&e사용법: /채팅아이템 <색채팅|닉변|색닉변> [플레이어]"
  giveitem-console-needs-target: "&c콘솔은 대상 플레이어를 지정해야 합니다."
  giveitem-target-not-found: "&c대상 플레이어를 찾을 수 없습니다."
  giveitem-invalid-type: "&c아이템 종류: 색채팅 | 닉변 | 색닉변"
  giveitem-success: "&a지급 완료: {item} -> {player}"
