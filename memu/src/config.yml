sqldb:
  enabled: true
  refresh_ticks: 100
  heartbeat_timeout_seconds: 20
  init_table_sql: "CREATE TABLE IF NOT EXISTS server_status (server_id VARCHAR(64) PRIMARY KEY, status VARCHAR(32) NOT NULL DEFAULT '오프라인', online_players INT NOT NULL DEFAULT 0, last_seen BIGINT NOT NULL DEFAULT 0)"
  query: "SELECT status, online_players, last_seen FROM server_status WHERE server_id = ? LIMIT 1"

proxy:
  refresh_ticks: 40
  online_timeout_ms: 12000
  tcp_check:
    enabled: true
    timeout_ms: 1200

status_targets:
  lobby:
    host: "127.0.0.1"
    port: 25565
  wild1:
    host: "127.0.0.1"
    port: 25566
  wild2:
    host: "127.0.0.1"
    port: 25567
  wild3:
    host: "127.0.0.1"
    port: 25568

